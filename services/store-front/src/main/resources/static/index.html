<!doctype html><html><head><meta charset="utf-8"><title>Pet Store</title><style>body{font:16px system-ui;max-width:1000px;margin:40px auto;background:#f6f8fb;color:#172033}h1{color:#087f8c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001}.card button{background:#087f8c;color:white;border:0;padding:10px 14px;border-radius:7px;cursor:pointer}</style></head><body><h1>🐾 Pet Store</h1><p>Everything your best friend needs.</p><div id="products" class="grid"></div><p id="message"></p><script>fetch('/api/products').then(r=>r.json()).then(ps=>{document.querySelector('#products').innerHTML=ps.map(p=>`<div class="card"><h2>${p.name}</h2><p>${p.description}</p><strong>$${p.price}</strong><br><br><button onclick="buy('${p.id}')">Add to order</button></div>`).join('')});function buy(id){fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:'web-customer',items:[id]})}).then(r=>r.json()).then(o=>document.querySelector('#message').textContent='Order '+o.id+' received!');}</script></body></html>
