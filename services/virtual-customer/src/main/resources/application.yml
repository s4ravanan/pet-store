server:
  port: 8085

spring:
  application:
    name: virtual-customer
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_CLIENT_URL:http://localhost:9000}
        instance:
          service-base-url: ${SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL:http://localhost:8085}
          prefer-ip: false

simulation:
  enabled: ${SIMULATION_ENABLED:true}
  order-interval-ms: ${ORDER_INTERVAL_MS:8000}

services:
  product-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  order-url: ${ORDER_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
