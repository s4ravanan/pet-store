server:
  port: 8080

spring:
  application:
    name: store-front
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_CLIENT_URL:http://localhost:9000}
        instance:
          service-base-url: ${SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL:http://localhost:8080}
          prefer-ip: false

petstore:
  product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8082}

logging:
  file:
    name: logs/store-front.log

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    logfile:
      enabled: true
