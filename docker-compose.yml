services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      - POSTGRES_DB=petstore
      - POSTGRES_USER=petstore
      - POSTGRES_PASSWORD=petstore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petstore -d petstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    environment:
      - HOME=/tmp
      - RABBITMQ_MNESIA_BASE=/tmp/mnesia
      - RABBITMQ_ERLANG_COOKIE=secret-cookie-petstore
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  admin-server:
    build:
      context: .
      dockerfile: services/admin-server/Dockerfile
    ports: ["9000:9000"]

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    ports: ["8081:8081"]
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/petstore
      - SPRING_DATASOURCE_USERNAME=petstore
      - SPRING_DATASOURCE_PASSWORD=petstore
      - SPRING_BOOT_ADMIN_CLIENT_URL=http://admin-server:9000
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL=http://product-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      admin-server:
        condition: service_started

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    ports: ["8082:8082"]
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/petstore
      - SPRING_DATASOURCE_USERNAME=petstore
      - SPRING_DATASOURCE_PASSWORD=petstore
      - SPRING_BOOT_ADMIN_CLIENT_URL=http://admin-server:9000
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL=http://order-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      admin-server:
        condition: service_started

  makeline-service:
    build:
      context: .
      dockerfile: services/makeline-service/Dockerfile
    ports: ["8083:8083"]
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/petstore
      - SPRING_DATASOURCE_USERNAME=petstore
      - SPRING_DATASOURCE_PASSWORD=petstore
      - SPRING_BOOT_ADMIN_CLIENT_URL=http://admin-server:9000
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL=http://makeline-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      admin-server:
        condition: service_started

  store-front:
    build:
      context: .
      dockerfile: services/store-front/Dockerfile
    ports: ["8080:8080"]
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - ORDER_SERVICE_URL=http://order-service:8082
      - SPRING_BOOT_ADMIN_CLIENT_URL=http://admin-server:9000
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL=http://store-front:8080
    depends_on:
      - product-service
      - order-service
      - admin-server

  store-admin:
    build:
      context: .
      dockerfile: services/store-admin/Dockerfile
    ports: ["8084:8084"]
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - ORDER_SERVICE_URL=http://order-service:8082
      - MAKELINE_SERVICE_URL=http://makeline-service:8083
      - SPRING_BOOT_ADMIN_CLIENT_URL=http://admin-server:9000
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL=http://store-admin:8084
    depends_on:
      - product-service
      - order-service
      - makeline-service
      - admin-server

  virtual-customer:
    build:
      context: .
      dockerfile: services/virtual-customer/Dockerfile
    ports: ["8085:8085"]
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - ORDER_SERVICE_URL=http://order-service:8082
      - SIMULATION_ENABLED=true
      - ORDER_INTERVAL_MS=8000
      - SPRING_BOOT_ADMIN_CLIENT_URL=http://admin-server:9000
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL=http://virtual-customer:8085
    depends_on:
      - product-service
      - order-service
      - admin-server

  virtual-worker:
    build:
      context: .
      dockerfile: services/virtual-worker/Dockerfile
    ports: ["8086:8086"]
    environment:
      - MAKELINE_SERVICE_URL=http://makeline-service:8083
      - SIMULATION_ENABLED=true
      - WORKER_INTERVAL_MS=10000
      - SPRING_BOOT_ADMIN_CLIENT_URL=http://admin-server:9000
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL=http://virtual-worker:8086
    depends_on:
      - makeline-service
      - admin-server
